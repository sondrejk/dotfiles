# Theme — run `kitty +kitten themes` and pick Gruvbox Dark to apply

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Cursor trail
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Tab bar
tab_bar_style    powerline
tab_bar_min_tabs 2

# Always launch zsh, regardless of $SHELL/passwd — kitty otherwise caches
# the shell it saw at its own startup, so a chsh done after kitty was last
# launched wouldn't take effect until a full kitty restart.
shell zsh

# Shell integration (copies terminfo to remote, enables image protocol, etc.)
shell_integration enabled

# Shift+Enter -> newline in Claude Code instead of submit.
#
# tmux' extkeys feature asks the terminal for extended keys using xterm's
# modifyOtherKeys (\E[>4;2m), but kitty does not implement that protocol --
# only its own. tmux in turn cannot speak kitty's protocol. Neither side
# bridges the gap, so Shift+Enter arrives as a plain CR and looks like Enter.
#
# Fix: have kitty emit the CSI-u form directly, without waiting to be asked.
# This matches `extended-keys-format csi-u` in .tmux.conf, so tmux parses it
# as Shift+Enter and forwards it unchanged.
map shift+enter send_text all \x1b[13;2u



# BEGIN_KITTY_THEME
# Gruvbox Material Dark Hard
include current-theme.conf
# END_KITTY_THEME